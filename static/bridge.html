<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirako Recall Bridge</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      main,
      video {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #050505;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        position: relative;
        display: grid;
        place-items: center;
      }

      video {
        display: block;
        object-fit: contain;
        background: #050505;
      }

      body.audio-only video {
        display: none;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #94a3b8;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: min(720px, calc(100vw - 24px));
        padding: 8px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.66);
        color: #e2e8f0;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .status.error {
        background: rgba(127, 29, 29, 0.82);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="fallback" id="fallback">Connecting Mirako</div>
      <video id="remote-video" autoplay playsinline></video>
      <audio id="remote-audio" autoplay></audio>
    </main>
    <div class="status" id="status">Starting bridge</div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.30/dist/bundle.min.js"></script>
    <script>
      const config = __BRIDGE_CONFIG__;
      const mediaMode = config.mode === "audio" ? "audio-only" : "video-only";

      const statusEl = document.getElementById("status");
      const fallbackEl = document.getElementById("fallback");
      const remoteVideo = document.getElementById("remote-video");
      const remoteAudio = document.getElementById("remote-audio");

      if (config.mode === "audio") {
        document.body.classList.add("audio-only");
        fallbackEl.textContent = "Mirako audio bridge";
      }

      const state = {
        pc: null,
        ws: null,
        gatewaySessionId: null,
        meetingAudioStream: null,
        remoteMediaStream: new MediaStream(),
        pendingLocalIceCandidates: [],
        pendingRemoteIceCandidates: [],
        vad: null,
        vadTimer: null,
        vadEndTimer: null,
        vadMode: null,
        vadSeq: 0,
        pendingStart: null,
        pendingStartTimer: null,
        vadPendingStart: null,
        vadStartTimer: null,
        vadAudioContext: null,
        vadAnalyser: null,
        audioUploadContext: null,
        audioUploadSource: null,
        audioUploadProcessor: null,
        audioUploadSink: null,
        audioUploadPending: new Float32Array(0),
        audioUploadPreSpeech: new Float32Array(0),
        audioUploadChunks: 0,
        audioUploadSamples: 0,
        vadEndFlushTimer: null,
        speakingStartedAt: 0,
        speakingSeq: null,
        lastVadEndAt: 0,
        vadStartSuppressUntil: 0,
        startedAt: Date.now(),
        trackCounts: { audio: 0, video: 0 },
        speaking: false,
        reconnectAttempts: 0,
        reconnectTimer: null,
        speechWatchdogTimer: null,
        cleaningUp: false,
        stopped: false,
      };

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
        console[isError ? "error" : "log"](`[bridge] ${message}`);
        sendTelemetry("status", { message, isError });
      }

      function showServiceError(error) {
        const message = error?.message || String(error || "unknown error");
        statusEl.textContent = "Service temporarily unavailable. Please try again later.";
        statusEl.classList.add("error");
        fallbackEl.textContent = "Service unavailable";
        sendTelemetry("service-error", { message, error: safeError(error) });
      }

      function safeError(error) {
        if (!error) return null;
        return {
          name: error.name || null,
          message: error.message || String(error),
          stack: error.stack || null,
        };
      }

      function sendTelemetry(event, payload = {}) {
        const body = {
          event,
          session_id: config.sessionId,
          gateway_session_id: state.gatewaySessionId,
          mirako_session_id: config.mirakoSessionId,
          mode: config.mode,
          elapsed_ms: Date.now() - state.startedAt,
          payload,
        };
        const data = JSON.stringify(body);
        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([data], { type: "application/json" });
            if (navigator.sendBeacon("/api/bridge-telemetry", blob)) return;
          }
          void fetch("/api/bridge-telemetry", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: data,
            keepalive: true,
          }).catch(() => {});
        } catch (_) {}
      }

      function playNotificationAudio(url) {
        state.vadStartSuppressUntil = Math.max(state.vadStartSuppressUntil, Date.now() + 1200);
        const audio = new Audio(url && !url.startsWith("/audio/") ? url : "/static/dd.mp3");
        audio.addEventListener("ended", () => {
          state.vadStartSuppressUntil = Math.max(state.vadStartSuppressUntil, Date.now() + 300);
        });
        audio.play().catch((error) => {
          sendTelemetry("notification-audio-failed", { error: safeError(error) });
        });
      }

      function summarizeTrack(track) {
        if (!track) return null;
        let settings = {};
        try {
          settings = track.getSettings ? track.getSettings() : {};
        } catch (_) {}
        return {
          id: track.id,
          kind: track.kind,
          label: track.label,
          enabled: track.enabled,
          muted: track.muted,
          readyState: track.readyState,
          settings,
        };
      }

      function collectMediaElementState() {
        return {
          video: {
            videoWidth: remoteVideo.videoWidth,
            videoHeight: remoteVideo.videoHeight,
            readyState: remoteVideo.readyState,
            networkState: remoteVideo.networkState,
            paused: remoteVideo.paused,
            muted: remoteVideo.muted,
            currentTime: Number(remoteVideo.currentTime.toFixed(3)),
            playbackRate: remoteVideo.playbackRate,
            tracks: state.remoteMediaStream.getTracks().map(summarizeTrack),
          },
          audio: {
            readyState: remoteAudio.readyState,
            networkState: remoteAudio.networkState,
            paused: remoteAudio.paused,
            currentTime: Number(remoteAudio.currentTime.toFixed(3)),
          },
        };
      }

      function toGatewayWsUrl(wsUrl, sessionId) {
        if (wsUrl) {
          const url = new URL(wsUrl);
          url.pathname = url.pathname.replace(/\/+/g, "/");
          return url.toString();
        }
        const url = new URL(config.gatewayUrl);
        url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
        url.pathname = `${url.pathname.replace(/\/$/, "")}/ws/${encodeURIComponent(sessionId)}`;
        url.pathname = url.pathname.replace(/\/+/g, "/");
        url.search = "";
        return url.toString();
      }

      async function postJson(path, body) {
        const response = await fetch(`${config.gatewayUrl}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          throw new Error(`Gateway ${path} failed: HTTP ${response.status} ${await response.text()}`);
        }
        return response.json();
      }

      async function createGatewaySession() {
        sendTelemetry("gateway-session-create-start", {
          gatewayUrl: config.gatewayUrl,
          mediaMode,
          conversationMode: config.conversationMode || "multi",
        });
        const setup = await postJson("/api/sessions", {
          api_key: config.mirakoSessionId,
          media_mode: mediaMode,
          conversation_mode: config.conversationMode || "multi",
        });
        state.gatewaySessionId = setup.session_id;
        sendTelemetry("gateway-session-create-success", {
          sessionId: setup.session_id,
          hasSdpOffer: Boolean(setup.sdp_offer),
          hasWsUrl: Boolean(setup.ws_url),
          iceServers: setup.ice_servers,
        });
        return setup;
      }

      async function getMeetingAudioStream() {
        return navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            sampleRate: 48000,
            channelCount: 1,
          },
        });
      }

      function sendWs(message) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
        state.ws.send(JSON.stringify(message));
      }

      function sendAudioBoundary(type, metrics, reason) {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          sendTelemetry("vad-boundary-skipped", {
            type,
            reason: "ws-not-open",
            seq: metrics.seq,
            duration_ms: metrics.durationMs || 0,
            rms: metrics.rms,
            peak: metrics.peak,
          });
          return false;
        }

        state.ws.send(
          JSON.stringify({
            type,
            timestamp: Date.now(),
            seq: metrics.seq,
            duration_ms: metrics.durationMs || 0,
            rms: metrics.rms,
            peak: metrics.peak,
            reason,
          })
        );
        return true;
      }

      const vadGate = {
        active: false,
        seq: 0,
        starts: 0,
        acceptedStarts: 0,
        ends: 0,
        misfires: 0,
        rejectedShort: 0,
        rejectedLowEnergy: 0,
        duplicateStarts: 0,
        duplicateEnds: 0,
        lastAcceptedEndAt: 0,
        lastStartSentAt: 0,
        activeSeq: null,
        activeStartedAt: 0,
        minSpeechMs: 700,
        startDelayMs: 120,
        endHangoverMs: 650,
        minStartRms: 0.015,
        minStartPeak: 0.07,
        minRestartGapMs: 250,
        positiveSpeechThreshold: 0.45,
        negativeSpeechThreshold: 0.30,
        redemptionMs: 700,
        uploadChunkSamples: 1600,
        preSpeechSamples: 8000,
        endTailFlushMs: 120,
        watchdogMs: 15000,
      };

      function audioMetricsFromFloat32(audio) {
        if (!audio || !audio.length) return { samples: 0, rms: 0, peak: 0, durationMs: 0 };
        let sumSquares = 0;
        let peak = 0;
        for (const sample of audio) {
          const value = Math.abs(sample || 0);
          sumSquares += value * value;
          if (value > peak) peak = value;
        }
        return {
          samples: audio.length,
          rms: Math.sqrt(sumSquares / audio.length),
          peak,
          durationMs: Math.round((audio.length / 16000) * 1000),
        };
      }

      function clearVadStartTimer() {
        if (state.vadStartTimer) {
          clearTimeout(state.vadStartTimer);
          state.vadStartTimer = null;
        }
        state.vadPendingStart = null;
      }

      function currentAudioMetrics() {
        const analyser = state.vadAnalyser;
        if (!analyser) return { rms: 0, peak: 0, samples: 0 };
        const samples = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(samples);
        let sumSquares = 0;
        let peak = 0;
        for (const sample of samples) {
          const value = Math.abs(sample || 0);
          sumSquares += value * value;
          if (value > peak) peak = value;
        }
        return { rms: Math.sqrt(sumSquares / samples.length), peak, samples: samples.length };
      }

      function attachVadAnalyser(stream) {
        try {
          const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextCtor) return;
          state.vadAudioContext = new AudioContextCtor({ sampleRate: 48000 });
          state.vadAnalyser = state.vadAudioContext.createAnalyser();
          state.vadAnalyser.fftSize = 2048;
          state.vadAudioContext.createMediaStreamSource(stream).connect(state.vadAnalyser);
        } catch (error) {
          sendTelemetry("vad-analyser-failed", { error: safeError(error) });
        }
      }

      function appendFloat32(existing, incoming) {
        if (!incoming || incoming.length === 0) return existing;
        if (!existing || existing.length === 0) {
          const copy = new Float32Array(incoming.length);
          copy.set(incoming);
          return copy;
        }
        const merged = new Float32Array(existing.length + incoming.length);
        merged.set(existing, 0);
        merged.set(incoming, existing.length);
        return merged;
      }

      function keepTrailingFloat32(samples, maxSamples) {
        if (!samples || samples.length <= maxSamples) return samples || new Float32Array(0);
        return samples.slice(samples.length - maxSamples);
      }

      function resampleTo16k(input, inputSampleRate) {
        if (!input || input.length === 0) return new Float32Array(0);
        if (inputSampleRate === 16000) {
          const copy = new Float32Array(input.length);
          copy.set(input);
          return copy;
        }
        const outputLength = Math.max(1, Math.round((input.length * 16000) / inputSampleRate));
        const output = new Float32Array(outputLength);
        const ratio = inputSampleRate / 16000;
        for (let i = 0; i < outputLength; i++) {
          const sourceIndex = i * ratio;
          const left = Math.floor(sourceIndex);
          const right = Math.min(left + 1, input.length - 1);
          const frac = sourceIndex - left;
          output[i] = input[left] * (1 - frac) + input[right] * frac;
        }
        return output;
      }

      function pcm16Bytes(samples) {
        const bytes = new Uint8Array(samples.length * 2);
        const view = new DataView(bytes.buffer);
        for (let i = 0; i < samples.length; i++) {
          const clamped = Math.max(-1, Math.min(1, samples[i] || 0));
          const value = clamped < 0 ? Math.round(clamped * 32768) : Math.round(clamped * 32767);
          view.setInt16(i * 2, value, true);
        }
        return bytes;
      }

      function binaryAudioFrame(samples) {
        const payload = pcm16Bytes(samples);
        const frame = new Uint8Array(13 + payload.length);
        const view = new DataView(frame.buffer);
        frame[0] = 0x01;
        view.setBigUint64(1, BigInt(Date.now()), false);
        view.setUint32(9, payload.length, false);
        frame.set(payload, 13);
        return frame;
      }

      function sendAudioSamples(samples) {
        if (!samples || samples.length === 0) return;
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          sendTelemetry("pcm-upload-skipped", { samples: samples.length, reason: "ws-not-open" });
          return;
        }
        state.ws.send(binaryAudioFrame(samples));
        state.audioUploadChunks += 1;
        state.audioUploadSamples += samples.length;
      }

      function appendUploadSamples(samples) {
        state.audioUploadPending = appendFloat32(state.audioUploadPending, samples);
        while (state.audioUploadPending.length >= vadGate.uploadChunkSamples) {
          const chunk = state.audioUploadPending.slice(0, vadGate.uploadChunkSamples);
          state.audioUploadPending = state.audioUploadPending.slice(vadGate.uploadChunkSamples);
          sendAudioSamples(chunk);
        }
      }

      function flushUploadSamples() {
        if (state.audioUploadPending.length > 0) {
          sendAudioSamples(state.audioUploadPending);
          state.audioUploadPending = new Float32Array(0);
        }
      }

      function flushPreSpeechToUpload() {
        if (state.audioUploadPreSpeech.length > 0) {
          appendUploadSamples(state.audioUploadPreSpeech);
          state.audioUploadPreSpeech = new Float32Array(0);
        }
      }

      function startPcmUploader(stream) {
        stopPcmUploader();
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) throw new Error("AudioContext is not available for PCM upload");
        state.audioUploadContext = new AudioContextCtor({ sampleRate: 48000 });
        state.audioUploadSource = state.audioUploadContext.createMediaStreamSource(stream);
        state.audioUploadProcessor = state.audioUploadContext.createScriptProcessor(4096, 1, 1);
        state.audioUploadSink = state.audioUploadContext.createGain();
        state.audioUploadSink.gain.value = 0;
        state.audioUploadPending = new Float32Array(0);
        state.audioUploadPreSpeech = new Float32Array(0);
        state.audioUploadChunks = 0;
        state.audioUploadSamples = 0;
        state.audioUploadProcessor.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          const copied = new Float32Array(input.length);
          copied.set(input);
          const resampled = resampleTo16k(copied, state.audioUploadContext.sampleRate || 48000);
          if (vadGate.active) {
            appendUploadSamples(resampled);
          } else {
            state.audioUploadPreSpeech = keepTrailingFloat32(
              appendFloat32(state.audioUploadPreSpeech, resampled),
              vadGate.preSpeechSamples
            );
          }
        };
        state.audioUploadSource.connect(state.audioUploadProcessor);
        state.audioUploadProcessor.connect(state.audioUploadSink);
        state.audioUploadSink.connect(state.audioUploadContext.destination);
        void state.audioUploadContext.resume().catch(() => undefined);
        sendTelemetry("pcm-uploader-ready", { sampleRate: state.audioUploadContext.sampleRate });
      }

      function stopPcmUploader() {
        if (state.audioUploadProcessor) {
          state.audioUploadProcessor.disconnect();
          state.audioUploadProcessor.onaudioprocess = null;
          state.audioUploadProcessor = null;
        }
        if (state.audioUploadSource) {
          state.audioUploadSource.disconnect();
          state.audioUploadSource = null;
        }
        if (state.audioUploadSink) {
          state.audioUploadSink.disconnect();
          state.audioUploadSink = null;
        }
        if (state.audioUploadContext) {
          void state.audioUploadContext.close().catch(() => undefined);
          state.audioUploadContext = null;
        }
        state.audioUploadPending = new Float32Array(0);
        state.audioUploadPreSpeech = new Float32Array(0);
      }

      function sendIceCandidate(candidate) {
        const message = {
          type: "ice-candidate",
          candidate: candidate.candidate,
          sdpMid: candidate.sdpMid,
          sdpMLineIndex: candidate.sdpMLineIndex,
          usernameFragment: candidate.usernameFragment,
        };
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
          state.pendingLocalIceCandidates.push(message);
          return;
        }
        state.ws.send(JSON.stringify(message));
      }

      function flushLocalIceCandidates() {
        if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
        const candidates = state.pendingLocalIceCandidates.splice(0);
        for (const candidate of candidates) {
          state.ws.send(JSON.stringify(candidate));
        }
      }

      function acceptVadStart(metrics, reason) {
        if (state.vadEndFlushTimer) {
          clearTimeout(state.vadEndFlushTimer);
          state.vadEndFlushTimer = null;
        }
        if (state.vadEndTimer) {
          clearTimeout(state.vadEndTimer);
          state.vadEndTimer = null;
        }
        if (vadGate.active) {
          vadGate.duplicateStarts += 1;
          sendTelemetry("vad-start-rejected", { reason: "duplicate-active", ...metrics });
          return false;
        }

        if (!sendAudioBoundary("audio-start", metrics, reason)) return false;

        vadGate.active = true;
        vadGate.acceptedStarts += 1;
        vadGate.activeSeq = metrics.seq;
        vadGate.lastStartSentAt = Date.now();
        vadGate.activeStartedAt = vadGate.lastStartSentAt;
        state.speaking = true;
        state.speakingStartedAt = vadGate.activeStartedAt;
        state.speakingSeq = metrics.seq;
        flushPreSpeechToUpload();
        sendTelemetry("vad-speaking", {
          speaking: true,
          vadMode: state.vadMode,
          seq: metrics.seq,
          duration_ms: metrics.durationMs || 0,
          rms: metrics.rms,
          peak: metrics.peak,
          reason,
          starts: vadGate.starts,
          acceptedStarts: vadGate.acceptedStarts,
          audioUploadChunks: state.audioUploadChunks,
          audioUploadSamples: state.audioUploadSamples,
        });
        return true;
      }

      function clearPendingVadStart() {
        if (state.pendingStartTimer) {
          clearTimeout(state.pendingStartTimer);
          state.pendingStartTimer = null;
        }
        state.pendingStart = null;
        clearVadStartTimer();
      }

      function confirmVadStart(reason = "real-vad-start") {
        const pending = state.pendingStart;
        if (!pending) return false;
        const liveMetrics = currentAudioMetrics();
        const acceptedMetrics = {
          seq: pending.seq,
          durationMs: Date.now() - pending.startedAt,
          rms: Math.max(pending.initial.rms, liveMetrics.rms),
          peak: Math.max(pending.initial.peak, liveMetrics.peak),
        };
        clearPendingVadStart();
        if (acceptedMetrics.rms < vadGate.minStartRms || acceptedMetrics.peak < vadGate.minStartPeak) {
          rejectVadCandidate(acceptedMetrics, "low-energy");
          return false;
        }
        return acceptVadStart(acceptedMetrics, reason);
      }

      function finishVadEnd(metrics, reason) {
        if (!vadGate.active) {
          vadGate.duplicateEnds += 1;
          sendTelemetry("vad-end-rejected", { reason: "inactive", ...metrics });
          return;
        }
        if (state.vadEndFlushTimer) clearTimeout(state.vadEndFlushTimer);
        state.vadEndFlushTimer = setTimeout(() => {
          state.vadEndFlushTimer = null;
          flushUploadSamples();
          sendAudioBoundary("audio-end", metrics, reason);
          vadGate.active = false;
          vadGate.activeSeq = null;
          vadGate.activeStartedAt = 0;
          vadGate.lastAcceptedEndAt = Date.now();
          state.speaking = false;
          state.speakingSeq = null;
          state.speakingStartedAt = 0;
          state.lastVadEndAt = vadGate.lastAcceptedEndAt;
          sendTelemetry("vad-speaking", {
            speaking: false,
            vadMode: state.vadMode,
            seq: metrics.seq,
            duration_ms: metrics.durationMs || 0,
            rms: metrics.rms,
            peak: metrics.peak,
            reason,
            ends: vadGate.ends,
            audioUploadChunks: state.audioUploadChunks,
            audioUploadSamples: state.audioUploadSamples,
          });
        }, vadGate.endTailFlushMs);
      }

      function rejectVadCandidate(metrics, reason) {
        if (reason === "short") vadGate.rejectedShort += 1;
        if (reason === "low-energy") vadGate.rejectedLowEnergy += 1;
        sendTelemetry("vad-start-rejected", { reason, ...metrics });
      }

      function requestVadStart() {
        const now = Date.now();
        if (now < state.vadStartSuppressUntil) {
          sendTelemetry("vad-start-rejected", {
            reason: "suppressed-local-playback",
            suppressRemainingMs: state.vadStartSuppressUntil - now,
            ...currentAudioMetrics(),
          });
          return;
        }
        if (state.lastVadEndAt && now - state.lastVadEndAt < vadGate.minRestartGapMs) {
          sendTelemetry("vad-start-rejected", {
            reason: "restart-gap",
            sinceEndMs: now - state.lastVadEndAt,
            ...currentAudioMetrics(),
          });
          return;
        }
        vadGate.starts += 1;
        const seq = ++vadGate.seq;
        const initialMetrics = currentAudioMetrics();
        const metrics = { seq, durationMs: 0, rms: initialMetrics.rms, peak: initialMetrics.peak };

        if (vadGate.active) {
          if (state.vadEndFlushTimer) {
            clearTimeout(state.vadEndFlushTimer);
            state.vadEndFlushTimer = null;
            sendTelemetry("vad-resumed", { reason: "tail-flush-cancelled", ...metrics });
          }
          vadGate.duplicateStarts += 1;
          return;
        }

        if (state.pendingStart) {
          vadGate.duplicateStarts += 1;
          sendTelemetry("vad-start-rejected", { reason: "duplicate-pending", ...metrics });
          return;
        }

        state.pendingStart = { seq, startedAt: now, initial: initialMetrics };
        sendTelemetry("vad-start-candidate", { ...metrics, reason: "raw-vad-start" });
      }

      function requestVadEnd(reason = "vad-end", audio = null) {
        vadGate.ends += 1;
        const audioMetrics = audioMetricsFromFloat32(audio);
        const liveMetrics = currentAudioMetrics();
        const durationMs = vadGate.active && vadGate.lastStartSentAt
          ? Math.max(audioMetrics.durationMs, Date.now() - vadGate.lastStartSentAt)
          : audioMetrics.durationMs;
        const metrics = {
          seq: vadGate.activeSeq || vadGate.seq,
          durationMs,
          rms: Math.max(audioMetrics.rms, liveMetrics.rms),
          peak: Math.max(audioMetrics.peak, liveMetrics.peak),
          samples: audioMetrics.samples,
        };

        if (!vadGate.active && state.pendingStart) {
          clearPendingVadStart();
          rejectVadCandidate(metrics, "short-or-ended-before-start-confirmed");
          return;
        }

        if (!vadGate.active) {
          vadGate.duplicateEnds += 1;
          sendTelemetry("vad-end-rejected", { reason: "inactive", ...metrics });
          return;
        }

        const acceptedReason = durationMs >= vadGate.minSpeechMs ? reason : "short-vad-end";
        finishVadEnd(metrics, acceptedReason);
      }

      function forceVadEnd(reason) {
        clearPendingVadStart();
        if (state.vadEndTimer) {
          clearTimeout(state.vadEndTimer);
          state.vadEndTimer = null;
        }
        if (vadGate.active) {
          finishVadEnd({ seq: vadGate.activeSeq || vadGate.seq, durationMs: vadGate.activeStartedAt ? Date.now() - vadGate.activeStartedAt : 0, ...currentAudioMetrics() }, reason);
        }
      }

      function startSpeechWatchdog() {
        if (state.speechWatchdogTimer) clearInterval(state.speechWatchdogTimer);
        state.speechWatchdogTimer = setInterval(() => {
          if (!state.speaking || !state.speakingStartedAt) return;
          if (Date.now() - state.speakingStartedAt > vadGate.watchdogMs) {
            sendTelemetry("vad-watchdog-audio-end", { speakingForMs: Date.now() - state.speakingStartedAt });
            forceVadEnd("vad-watchdog");
          }
        }, 1000);
      }

      async function startSimpleVad(stream) {
        const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextCtor) {
          requestVadStart();
          return;
        }

        const audioContext = new AudioContextCtor({ sampleRate: 48000 });
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);

        const samples = new Uint8Array(analyser.fftSize);
        let speechFrames = 0;
        let silenceFrames = 0;

        state.vad = { audioContext, source, analyser };
        state.vadTimer = setInterval(() => {
          analyser.getByteTimeDomainData(samples);
          let sum = 0;
          for (const sample of samples) {
            const centered = sample - 128;
            sum += centered * centered;
          }
          const rms = Math.sqrt(sum / samples.length);
          if (rms > 6) {
            speechFrames += 1;
            silenceFrames = 0;
          } else {
            silenceFrames += 1;
            speechFrames = 0;
          }
          if (!vadGate.active && speechFrames >= 3) {
            requestVadStart();
            confirmVadStart("simple-vad-start");
          }
          if (vadGate.active && silenceFrames >= 20) requestVadEnd("simple-vad-end");
        }, 100);
      }

      async function startVad(stream) {
        if (window.vad && window.vad.MicVAD) {
          try {
            state.vad = await window.vad.MicVAD.new({
              baseAssetPath: "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.30/dist/",
              onnxWASMBasePath: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/",
              model: "v5",
              positiveSpeechThreshold: vadGate.positiveSpeechThreshold,
              negativeSpeechThreshold: vadGate.negativeSpeechThreshold,
              redemptionMs: vadGate.redemptionMs,
              preSpeechPadFrames: 8,
              minSpeechFrames: 5,
              getStream: async () => stream,
              onSpeechStart: requestVadStart,
              onSpeechRealStart: () => confirmVadStart("real-vad-start"),
              onSpeechEnd: (audio) => requestVadEnd("accepted-vad-end", audio),
              onVADMisfire: () => forceVadEnd("vad-misfire"),
            });
            state.vad.start();
            state.vadMode = "ricky0123/vad-web-stream";
            setStatus("VAD ready; waiting for media");
            sendTelemetry("vad-ready", { mode: state.vadMode, providedStream: true });
            return;
          } catch (error) {
            console.warn("vad-web failed; falling back to simple VAD", error);
            sendTelemetry("vad-web-failed", { error: safeError(error) });
          }
        }

        await startSimpleVad(stream);
        state.vadMode = "simple-rms";
        sendTelemetry("vad-ready", { mode: state.vadMode });
      }

      async function flushRemoteIceCandidates() {
        const candidates = state.pendingRemoteIceCandidates.splice(0);
        for (const candidate of candidates) {
          try {
            await state.pc.addIceCandidate(candidate);
          } catch (error) {
            console.warn("Failed to add queued ICE candidate", error);
          }
        }
      }

      function attachRemoteTrack(event) {
        state.trackCounts[event.track.kind] = (state.trackCounts[event.track.kind] || 0) + 1;
        sendTelemetry("remote-track", {
          track: summarizeTrack(event.track),
          streamIds: event.streams.map((stream) => stream.id),
          trackCounts: state.trackCounts,
        });

        event.track.onmute = () => sendTelemetry("remote-track-mute", { track: summarizeTrack(event.track) });
        event.track.onunmute = () => sendTelemetry("remote-track-unmute", { track: summarizeTrack(event.track) });
        event.track.onended = () => sendTelemetry("remote-track-ended", { track: summarizeTrack(event.track) });

        if (config.mode === "audio") {
          const stream = event.streams[0] || new MediaStream([event.track]);
          if (event.track.kind === "audio" && remoteAudio.srcObject !== stream) {
            remoteAudio.srcObject = stream;
            void remoteAudio.play().catch((error) => {
              sendTelemetry("audio-play-failed", { error: safeError(error), media: collectMediaElementState() });
              setStatus(`Audio autoplay failed: ${error.message}`, true);
            });
          }
          return;
        }

        if (!state.remoteMediaStream.getTracks().some((track) => track.id === event.track.id)) {
          state.remoteMediaStream.addTrack(event.track);
        }

        if (event.track.kind === "video") {
          fallbackEl.style.display = "none";
        }

        if (remoteVideo.srcObject !== state.remoteMediaStream) {
          remoteVideo.srcObject = state.remoteMediaStream;
        }
        void remoteVideo.play().catch((error) => {
          sendTelemetry("video-play-failed", { error: safeError(error), media: collectMediaElementState() });
          setStatus(`Video autoplay failed: ${error.message}`, true);
        });
      }

      async function connectWebRtc(setup) {
        state.pc = new RTCPeerConnection({
          iceServers: setup.ice_servers || [{ urls: "stun:stun.l.google.com:19302" }],
        });
        sendTelemetry("webrtc-peer-created", { iceServers: setup.ice_servers || null });

        state.pc.ontrack = attachRemoteTrack;
        state.pc.onconnectionstatechange = () => {
          setStatus(`WebRTC ${state.pc.connectionState}`);
          sendTelemetry("webrtc-connection-state", { connectionState: state.pc.connectionState });
          if (["failed", "disconnected"].includes(state.pc.connectionState)) {
            scheduleReconnect();
          }
        };
        state.pc.oniceconnectionstatechange = () => {
          sendTelemetry("webrtc-ice-state", { iceConnectionState: state.pc.iceConnectionState });
        };
        state.pc.onicegatheringstatechange = () => {
          sendTelemetry("webrtc-ice-gathering-state", { iceGatheringState: state.pc.iceGatheringState });
        };
        state.pc.onsignalingstatechange = () => {
          sendTelemetry("webrtc-signaling-state", { signalingState: state.pc.signalingState });
        };

        state.pc.onicecandidate = (event) => {
          if (!event.candidate) {
            sendTelemetry("local-ice-complete");
            return;
          }
          sendTelemetry("local-ice-candidate", {
            candidateType: event.candidate.type,
            protocol: event.candidate.protocol,
            address: event.candidate.address,
            port: event.candidate.port,
          });
          sendIceCandidate(event.candidate);
        };

        state.meetingAudioStream = await getMeetingAudioStream();
        attachVadAnalyser(state.meetingAudioStream);
        startPcmUploader(state.meetingAudioStream);
        sendTelemetry("meeting-audio-stream", {
          tracks: state.meetingAudioStream.getTracks().map(summarizeTrack),
        });
        sendTelemetry("meeting-audio-upload", { transport: "websocket-pcm16" });

        const hasServerOffer = Boolean(setup.sdp_offer);
        let localAnswer = null;
        if (hasServerOffer) {
          await state.pc.setRemoteDescription({ type: "offer", sdp: setup.sdp_offer });
          localAnswer = await state.pc.createAnswer();
          await state.pc.setLocalDescription(localAnswer);
        }

        await new Promise((resolve, reject) => {
          const ws = new WebSocket(toGatewayWsUrl(setup.ws_url, setup.session_id));
          state.ws = ws;
          const timeout = setTimeout(() => reject(new Error("Gateway WebSocket timeout")), 15000);
          sendTelemetry("gateway-ws-connecting", { wsUrl: toGatewayWsUrl(setup.ws_url, setup.session_id) });

          ws.onopen = () => {
            clearTimeout(timeout);
            sendTelemetry("gateway-ws-open");
            if (hasServerOffer) {
              ws.send(JSON.stringify({ type: "answer", sdp: localAnswer.sdp }));
              flushLocalIceCandidates();
              resolve();
              return;
            }

            state.pc
              .createOffer({
                offerToReceiveVideo: mediaMode === "video-only",
                offerToReceiveAudio: true,
              })
              .then((offer) => state.pc.setLocalDescription(offer).then(() => offer))
              .then((offer) => {
                ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp }));
                flushLocalIceCandidates();
                resolve();
              })
              .catch(reject);
          };

          ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            sendTelemetry("gateway-ws-message", { type: message.type });
            if (message.type === "answer") {
              await state.pc.setRemoteDescription({ type: "answer", sdp: message.sdp });
              await flushRemoteIceCandidates();
              setStatus("WebRTC answer applied; waiting for media");
              return;
            }
            if (message.type === "ice-candidate") {
              const candidate = new RTCIceCandidate(message.candidate);
              if (!state.pc.remoteDescription) {
                state.pendingRemoteIceCandidates.push(candidate);
                return;
              }
              try {
                await state.pc.addIceCandidate(candidate);
              } catch (error) {
                console.warn("Failed to add remote ICE candidate", error);
              }
              return;
            }
            if (message.type === "answer-applied") {
              await flushRemoteIceCandidates();
              setStatus("WebRTC answer applied; waiting for media");
              return;
            }
            if (["wakeword-start", "wakeword-stop", "conversation-mode-changed"].includes(message.type)) {
              playNotificationAudio(message.notificationAudioUrl);
              sendTelemetry("notification-audio", { type: message.type });
            }
          };

          ws.onerror = (event) => {
            sendTelemetry("gateway-ws-error", { readyState: ws.readyState, eventType: event.type });
            reject(new Error("Gateway WebSocket error"));
          };
          ws.onclose = (event) => {
            sendTelemetry("gateway-ws-close", { code: event.code, reason: event.reason, wasClean: event.wasClean });
            if (!state.cleaningUp) scheduleReconnect();
          };
        });

        await startVad(state.meetingAudioStream);
        startSpeechWatchdog();
      }

      async function stopGatewaySession() {
        if (!state.gatewaySessionId) return;
        try {
          await fetch(`${config.gatewayUrl}/api/sessions/${encodeURIComponent(state.gatewaySessionId)}/stop`, {
            method: "POST",
          });
        } catch (error) {
          console.warn("Failed to stop gateway session", error);
        }
      }

      function cleanup() {
        state.cleaningUp = true;
        if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
        if (state.vadTimer) clearInterval(state.vadTimer);
        if (state.vadEndTimer) clearTimeout(state.vadEndTimer);
        if (state.vadStartTimer) clearTimeout(state.vadStartTimer);
        if (state.speechWatchdogTimer) clearInterval(state.speechWatchdogTimer);
        if (state.vad && state.vad.audioContext) void state.vad.audioContext.close();
        if (state.vadAudioContext) void state.vadAudioContext.close();
        if (state.vadEndFlushTimer) clearTimeout(state.vadEndFlushTimer);
        stopPcmUploader();
        if (state.ws) {
          state.ws.onclose = null;
          state.ws.close();
        }
        if (state.pc) {
          state.pc.onconnectionstatechange = null;
          state.pc.close();
        }
        if (state.meetingAudioStream) {
          for (const track of state.meetingAudioStream.getTracks()) track.stop();
        }
        state.ws = null;
        state.pc = null;
        state.meetingAudioStream = null;
        state.pendingLocalIceCandidates = [];
        state.pendingRemoteIceCandidates = [];
        state.remoteMediaStream = new MediaStream();
        state.vad = null;
        state.vadTimer = null;
        state.vadEndTimer = null;
        state.pendingStart = null;
        state.pendingStartTimer = null;
        state.vadStartTimer = null;
        state.vadEndFlushTimer = null;
        state.speechWatchdogTimer = null;
        state.vadAudioContext = null;
        state.vadAnalyser = null;
        state.vadPendingStart = null;
        state.speakingStartedAt = 0;
        state.speakingSeq = null;
        state.lastVadEndAt = 0;
        state.vadStartSuppressUntil = 0;
        vadGate.active = false;
        vadGate.activeSeq = null;
        vadGate.activeStartedAt = 0;
        vadGate.lastStartSentAt = 0;
        vadGate.lastAcceptedEndAt = 0;
        state.trackCounts = { audio: 0, video: 0 };
        state.vadMode = null;
        state.speaking = false;
        state.reconnectTimer = null;
        state.cleaningUp = false;
      }

      function scheduleReconnect() {
        if (state.stopped) return;
        state.reconnectAttempts += 1;
        if (state.reconnectAttempts > 5) {
          setStatus("Bridge reconnect limit reached", true);
          return;
        }
        const delay = Math.min(10000, 1000 * state.reconnectAttempts);
        setStatus(`Bridge reconnecting in ${delay}ms`);
        cleanup();
        state.reconnectTimer = setTimeout(() => {
          state.reconnectTimer = null;
          start().catch((error) => setStatus(error.message, true));
        }, delay);
      }

      async function start() {
        sendTelemetry("bridge-start", {
          userAgent: navigator.userAgent,
          location: window.location.href,
          viewport: { width: window.innerWidth, height: window.innerHeight, devicePixelRatio: window.devicePixelRatio },
        });
        setStatus(`Creating ${mediaMode} gateway session`);
        const setup = await createGatewaySession();
        state.gatewaySessionId = setup.session_id;
        setStatus(`Gateway session ${setup.session_id}; connecting WebRTC`);
        await connectWebRtc(setup);
        state.reconnectAttempts = 0;
        setTimeout(() => {
          if (statusEl.classList.contains("error")) return;
          statusEl.style.display = "none";
        }, 12000);
      }

      window.addEventListener("beforeunload", () => {
        sendTelemetry("bridge-beforeunload", { media: collectMediaElementState() });
        state.stopped = true;
        cleanup();
        void stopGatewaySession();
      });

      window.addEventListener("error", (event) => {
        sendTelemetry("window-error", {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: safeError(event.error),
        });
      });

      window.addEventListener("unhandledrejection", (event) => {
        sendTelemetry("unhandled-rejection", { reason: safeError(event.reason) || String(event.reason) });
      });

      remoteVideo.addEventListener("loadedmetadata", () => sendTelemetry("video-loadedmetadata", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("loadeddata", () => sendTelemetry("video-loadeddata", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("canplay", () => sendTelemetry("video-canplay", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("playing", () => sendTelemetry("video-playing", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("waiting", () => sendTelemetry("video-waiting", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("stalled", () => sendTelemetry("video-stalled", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("resize", () => sendTelemetry("video-resize", { media: collectMediaElementState() }));
      remoteVideo.addEventListener("error", () => {
        const error = remoteVideo.error;
        sendTelemetry("video-element-error", {
          error: error ? { code: error.code, message: error.message } : null,
          media: collectMediaElementState(),
        });
      });

      start().catch((error) => showServiceError(error));
    </script>
  </body>
</html>
